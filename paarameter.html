<!-- PARAMETER -->
 <!-- mething give to the function to create  the returning value.

 the para meter and the and the return value are just opposite to each other 

 parameters are give in CAMEL cases only. -->


 <!-- THERE IS DIFFERENT BETWEEN THE OUTPUT VALUE AND THE RETURN VALUE 
 1. output value -
 The value that is shown to the user (using console.log(), alert(), document.write(), etc.)(these all are unctional value).


 2.returned value is given when the function is called. -->
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <title>parameter</title>
 </head>
 <body>
    <script>
        function sum(a,b){
        //this is parameter. 
            let sum = a+b;
            return sum;

        }
        console.log(sum(2,3));
        // this is argument.
    </script>
 </body>
 </html>
